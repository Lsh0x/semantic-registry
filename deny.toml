[advisories]
version = 2
ignore = [
    # zip ^8 is pinned by candle-core 0.11 (fixed in zip 9). All three advisories
    # target ZipArchive::extract(), which candle never calls: it only reads .npz
    # members by name, and tools-rag loads safetensors. Drop once candle moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "extract() not reachable via candle-core" },
    { id = "RUSTSEC-2026-0368", reason = "extract() not reachable via candle-core" },
    { id = "RUSTSEC-2026-0369", reason = "extract() not reachable via candle-core" },
    # paste is unmaintained with no successor; compile-time proc-macro pulled by gemm.
    { id = "RUSTSEC-2024-0436", reason = "build-time only, no safe upgrade available" },
]

[licenses]
version = 2
# Permissive licenses only — the crate itself is MIT OR Apache-2.0 and must
# stay embeddable in closed-source products.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # webpki-roots (via hf-hub → reqwest → rustls), `candle` feature only
    "CDLA-Permissive-2.0",
    # option-ext (via hf-hub → dirs): file-level copyleft, unmodified use is fine
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory of the current tree.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
