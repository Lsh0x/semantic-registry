[package]
name = "semantic-registry"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A registry of named entries searched by meaning: tools, skills, prompts or schemas for LLM agents. MaxSim over learned examples, with a guarded feedback loop."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lsh0x/semantic-registry"
documentation = "https://docs.rs/semantic-registry"
readme = "README.md"
keywords = ["semantic-search", "llm", "agents", "embeddings", "mcp"]
categories = ["text-processing", "science"]
exclude = [".github/", "assets/", "**/*.un~"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs"] }

# Dépendances ML optionnelles
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
hf-hub = { version = "0.5", features = ["tokio"], optional = true }
tokenizers = { version = "0.23", optional = true }

# Cache d'embeddings optionnel (aucune dépendance transitive)
tiercache = { version = "0.1", optional = true }

[features]
default = []
cache = ["dep:tiercache"]
# Ingestion de `tools/list` et définition de `search_tools` (aucune dépendance)
mcp = []
candle = [
    "tokio/rt",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:hf-hub",
    "dep:tokenizers",
]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "basic"
required-features = ["candle"]

[[example]]
name = "feedback"
required-features = ["candle", "cache"]

[[example]]
name = "persistent_store"
required-features = ["candle"]

[[example]]
name = "prompt_routing"
required-features = ["candle"]

[[example]]
name = "llm_example_gen"
required-features = ["candle"]
